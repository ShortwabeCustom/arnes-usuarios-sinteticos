# Estándares del equipo UiX (rutas relativas al vault). Se leen en todo estudio.
equipo:
  fuentes_crudas: fuentes-equipo/uix               # en este repositorio: las guías tal como las entregó UiX
  notas: [01-Fuentes/estandares-uix.md, 03-Sintesis/estandares-uix-en-investigacion-sintetica.md]

# Notas del vault sobre un producto (rutas relativas al vault). Se leen cuando el estudio declara `guia_estilo`.
productos:
  pwa:
    fuentes_crudas: fuentes-producto/pwa          # en este repositorio: los manuales tal como los entregó UX writing
    notas: [01-Fuentes/manuales-ux-writing-pwa.md, 03-Sintesis/voz-y-tono-de-la-originacion-unica.md]
    enlaces: [manuales-ux-writing-pwa, voz-y-tono-de-la-originacion-unica]

# Notas de concepto que una síntesis de estudio enlaza siempre (wikilinks).
enlaces_sintesis:
  comun: [investigacion-con-usuarios-sinteticos, marco-de-metodos-de-investigacion-ux, estandares-uix-en-investigacion-sintetica]
  persona: [personas-y-arquetipos]
