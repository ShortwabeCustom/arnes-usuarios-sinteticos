# Base de conocimiento metodológico: el vault de Obsidian «vault-equipo» (wiki vivo, mantenido aparte).
# El arnés lo LEE en su ruta (no lo copia) y ESCRIBE solo en 03-Sintesis/ más las entradas de índice y log.
# Ruta con comodín para no guardar el correo de la cuenta en el repositorio; ARNES_VAULT la reemplaza.
vault: "~/Library/CloudStorage/GoogleDrive-*/Mi unidad/Obsidian/vault-equipo"
sintesis: 03-Sintesis
indice: 00-Indice/index.md
log: 00-Indice/log.md

