aprendizajes_metodo:
  - "Prototipos táctiles de Figma: el cursor de «dedo» aparece en todo el lienzo y el barrido de cursor da 0 zonas. Los resaltados de hotspots (tocar el fondo) sí las encuentran; dentro de un overlay hay que tocar su manija o se cierra."
  - "Validar el instrumento con el mismo camino de código que la sesión real (ventana visible, mismas rutas de captura, pausas de pensamiento). El mapeo sin ventana pasó y la sesión falló tres veces: escala Retina, captura previa sobrescrita y toque demasiado rápido."
  - "El toque en Figma necesita llegar, esperar y tocar (150 ms): mover y hacer clic en el mismo instante a veces cuenta como toque fuera del botón."
  - "Cuando el prototipo no conecta una rama (el «No» del asesor), dividir en dos tareas y cerrar la primera con una pregunta sin actuar conserva la hipótesis sin medir el prototipo en lugar del producto."
  - "Recortar la captura al teléfono reduce el crecimiento del contexto de ≈ 4,800 a ≈ 3,100 tokens por paso. La estimación previa quedó ≈ 20% baja; recalibrada con las 16 sesiones, su error medio es ≈ 3%."
conceptos: [first-click-testing, formularios-copy-y-validacion, accesibilidad-cognitiva, metricas-ux]
positivos:
  - "El primer toque fue el esperado en 16 de 16 sesiones: la acción principal de la bienvenida y de la pregunta del asesor se encuentran sin dudar."
  - "El código de verificación sube la confianza: los perfiles lo reconocen como «lo normal en bancos»."
  - "Los datos de contacto son tres campos y se llenan en orden sin errores ni validaciones disparadas (0 de 8 sesiones)."
  - "La introducción a la selfie explica para qué es la foto y anticipa los permisos; con asesor, la confianza en cámara y ubicación cae 13 puntos o menos."
  - "El tramo con asesor (número de empleado → selfie) se completa en 6–7 toques con confianza de 62–72."
  - "El mensaje de seguridad de la bienvenida («Tus datos están 100% seguros») tranquiliza a Itzel, que teme a las estafas."
estado_prototipado:
  - "En «Uso del préstamo» solo «Efectivo» está conectado."
  - "En «Elige tu plazo» solo responde «100 semanas»: 5 de 8 sesiones de T1 intentan otro plazo (26 o más corto) y no pasa nada."
  - "La rama «No» de «¿te está ayudando un asesor?» no está conectada: por eso T1 termina en esa pregunta."
  - "El monto ($22,000) y la barra no se ajustan; los enlaces de Aviso de Privacidad y Consulta de Historial no abren."
  - "«Tomar selfie» no tiene conexión: es el fin del prototipo."
  - "Los campos se llenan solos al tocarlos y solo en orden (nombre → celular → correo)."
limitaciones:
  - "Los perfiles son sintéticos y derivan de la evidencia disponible; no sustituyen pruebas con personas."
  - "4 perfiles (panel base4, sin capa OCEAN) × 2 corridas por tarea: hablan de patrones del panel, no de porcentajes de clientes."
  - "Es un prototipo: lo no conectado es estado de prototipado, no defecto. El plazo, el monto y la rama «No» no se pudieron evaluar."
  - "T2 empieza a mitad del flujo y con asesor: la confianza en los permisos es un techo; sin asesor y tras todo el flujo podría ser menor."
  - "Los datos los llena el prototipo: no se mide el esfuerzo real de escribir. El tiempo estimado es un modelo [SUPUESTO]."
  - "El perfil ve las zonas tocables numeradas, que una persona no ve [SUPUESTO METODOLÓGICO]; un toque que no cambia la pantalla se repite una vez."
  - "Las sesiones de Bryan se corrieron con el banner de cookies visible fuera del teléfono; las demás, sin él. No afecta lo que el perfil ve (captura recortada al teléfono)."
validar_con_personas:
  - {que: "Mostrar el total a pagar antes de confirmar", metodo: abtesting, hallazgo: H1, prioridad: Alta, aprender: "¿Ver el total y el número de pagos junto al pago semanal mejora la confianza y la calidad de la decisión de plazo?"}
  - {que: "Consentimiento de buró explícito y legible", metodo: pdu, hallazgo: H2, prioridad: Alta, aprender: "¿Las personas entienden qué autorizan y prefieren una casilla explícita al texto al pie?"}
  - {que: "Solicitud sin asesor (rama «No»)", metodo: pdu, hallazgo: H4, prioridad: Media, aprender: "¿Quien solicita solo entiende para qué se pregunta por el asesor y cómo sigue el flujo? Requiere conectar la rama en el prototipo."}
  - {que: "Permisos de cámara y ubicación sin acompañamiento", metodo: pdu, hallazgo: H7, prioridad: Media, aprender: "¿La confianza en los permisos se sostiene al final del flujo completo y sin asesor presente?"}
proximos_pasos:
  - "Conectar en el prototipo la rama «No» del asesor, los plazos y el monto, y repetir el recorrido (es la línea base de este benchmark)."
  - "Comparar con la PWA actual en el ambiente dev con el mismo protocolo para tener la segunda columna del benchmark."
  - "Probar las recomendaciones H1–H3 con personas: 8–10 en prueba de usabilidad, según la guía de UiX."
limitaciones_tecnicas:
  - "Dos pilotos y la primera ronda de Bryan fallaron por el instrumento (escala de captura, overlays, toque rápido); están en datos/historial/ y no cuentan como resultados."
