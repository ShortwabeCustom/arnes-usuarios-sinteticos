  bryan: {cita: "Fue bastante fácil y rápido, todo en el cel, pero nunca me dijeron cuántos pasos faltaban y solo vi el pago semanal sin costo total.", entiende: "El orden del flujo y el código de verificación.", rompe: "No ver el total ni el avance; quiere resolverlo solo y rápido."}
  itzel: {cita: "Me dan un solo número y yo tengo que hacer la cuenta.", entiende: "Que todo sigue en el celular y que no pide datos al inicio.", rompe: "Autorizar buró antes de saber el total; es la sesión con CES más bajo (3)."}
