# Narrativa del reporte · OU 2.0, descubrimiento preliminar (recorrido sobre el prototipo de Figma, flujo amarillo).
# Escrita después de `arnes analizar` y `arnes auditar`. Cifras = sesiones simuladas, no personas.
titulo_corto: OU 2.0 · descubrimiento
confianza: alta          # confianza global del veredicto (tablero)
tablero: {pasos_prometidos: 4}   # la bienvenida promete «4 pasos»
titular: "El flujo se recorre sin perderse, pero el préstamo se confirma sin ver cuánto se pagará en total: lo señalan 8 de 8 sesiones"
veredicto: >-
  Los cuatro perfiles de la PWA llegan de la bienvenida a la pregunta del asesor (8 de 8 sesiones) y, con un asesor, hasta
  la selfie (8 de 8). La confianza cae en dos momentos: al ver solo el pago semanal ($525 por 100 semanas, sin total) y al
  autorizar la consulta de buró en letra chica. Conviene mostrar el total a pagar antes de «Confirmar», hacer explícito y
  legible el consentimiento de buró y decir en qué paso va el usuario. Son hipótesis para validar con personas.
decision:
  - {texto: "El flujo base se puede recorrer sin ayuda hasta la pregunta del asesor", si: true}
  - {texto: "Mostrar el total a pagar antes de confirmar el monto", si: true}
  - {texto: "Dar por resuelto el consentimiento de buró tal como está", si: false}
  - {texto: "Evaluar la rama «No me ayuda un asesor»: no existe en el prototipo", si: false}
kpis:
  - {valor: "7 de 8", etiqueta: "sesiones de T1 llegan a la pregunta del asesor con fricción", detalle: "Una llega sin fricción. La fricción se concentra en monto y plazo y en el consentimiento de buró.", tono: duda, verificar: "T1|exito_con_friccion"}
  - {valor: "7 de 8", etiqueta: "sesiones de T2 llegan a la selfie sin fricción", detalle: "Con un asesor presente, el tramo de número de empleado, selfie y permisos se recorre en 6–7 toques.", tono: bien, verificar: "T2|exito"}
  - {valor: "4", etiqueta: "facilidad percibida en T1 (CES 1–7, mediana)", detalle: "En T2 es 5.5. Las razones de T1: no ver el total, la letra chica y no saber cuántos pasos faltan.", tono: duda, verificar: "metrica|T1|ces"}
  - {valor: "17", etiqueta: "pasos de la bienvenida a la pregunta del asesor (mediana)", detalle: "13 pantallas y 8 campos. La bienvenida promete «4 pasos» y «menos de 5 minutos».", tono: duda, verificar: "metrica|T1|pasos"}
kpis_nota: "Corridas de perfiles sintéticos (4 perfiles × 2 corridas por tarea), no personas. El tiempo estimado es un modelo, no una medición."
resumen:
  - "En 8 de 8 sesiones de T1 el perfil confirma el monto viendo solo el pago semanal y comenta que no sabe cuánto pagará en total. Itzel hace la cuenta: $525 × 100 semanas es más del doble de $22,000."
  - "La pantalla del pago semanal tiene la confianza más baja del flujo (media 45 de 100, mínima 33) y fricción 3 o más en 9 de 11 observaciones."
  - "La autorización de consulta de historial crediticio va en letra chica y se acepta al tocar «Continuar». 7 de 8 sesiones de T1 la mencionan; en 4 (Arturo y Rosalba) el perfil dice que no alcanza a leerla."
  - "En ningún paso de T1 los perfiles dicen saber en qué parte del proceso van (0 de 130 respuestas «sí»). La bienvenida promete «4 pasos» y la mediana es de 17 pasos; 8 de 8 sesiones de T2 cierran diciendo que no supieron cuántos pasos faltaban."
  - "Ante «¿te está ayudando un asesor?», 8 de 8 contestarían «No» sin dudar, y 8 de 8 dicen no entender para qué se pregunta; varios sospechan que es para la comisión de alguien."
  - "Al completar el código de verificación no hay botón ni señal de envío: en 8 de 8 sesiones de T1 el perfil decide esperar sin tocar, por miedo a «tocar a ciegas»."
  - "Con asesor presente, los permisos de cámara y ubicación no hacen caer la confianza más de 13 puntos; la introducción a la selfie los anticipa. 4 de 8 sesiones de T2 preguntan para qué se usa la ubicación."
  - "La auditoría con 3 evaluadores coincide (3 de 3) en dos puntos de redacción: «Crédito sujeto a aprobación» contradice el glosario, que pide «préstamo», y «Te prestamos hasta $70,000» no aclara que depende de aprobación."
  - "«Confirmar» (monto y plazo) y «Tomar foto» (introducción a la selfie) quedan cortados al pie de la pantalla; 5 de 8 sesiones de T2 lo mencionan."
  - "El primer toque fue el esperado en 16 de 16 sesiones: «Inicia tu solicitud» y «Sí, me están ayudando» se encuentran sin dudar."
