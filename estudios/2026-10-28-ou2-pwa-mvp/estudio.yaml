# Estudio de recorrido de un flujo interactivo (prototipo Figma o sitio web real).
# Segunda medición del benchmark de Originación Única 2.0: la PWA funcional (MVP) en una URL de pruebas.
id: 2026-10-28-ou2-pwa-mvp
titulo: "Segunda medición de Originación Única 2.0: la PWA funcional (MVP), de la bienvenida a la encuesta"
pregunta_principal: "¿Un cliente nuevo puede pedir su préstamo de punta a punta en la PWA sin ayuda, qué le cuesta en cada etapa y qué cambió frente al prototipo de Figma?"
metodo: recorrido
fecha: "2026-10-28"
autor: "Alexis Valdez + Claude"
producto: "Originación Única · PWA"
marca: {color: "#0B6B4F", nombre: "Banco Azteca"}

# Estándares de UiX (fuentes-equipo/uix/). Con este bloque el reporte se llama proyecto-metodologia-tema_aaaa-mm-dd-vN
# y el tema lleva «-sintetico» al final, para que no se confunda con un estudio hecho con personas.
uix:
  proyecto: oupwa
  metodologia: pdu
  tema: originacion-unica-2-0-pwa
  version: 1
  cliente: "Originación Única · PWA"
  autorizacion: "Alexis Valdez"
  alcance: descriptiva
  decision: {impacto: alto, incertidumbre: alta}

guia_estilo: pwa
biblioteca: pwa
panel: base4              # el mismo panel que la primera medición (OU 2.0 en Figma): las dos se pueden comparar
modelo: sonnet

material: web
# MVP en una URL de pruebas: los servicios son simulados (sin reglas de negocio del backend). Escenarios por URL:
# velocidad=rapida (esperas ×10 más cortas), camara=simulada, ubicacion=simulada (Del Valle, CDMX). El resto queda en
# su valor por omisión: OTP correcto, selfie aprobada, INE válida, dirección encontrada, evaluación aprobada, agenda
# disponible. [SUPUESTO METODOLÓGICO] Las esperas reales declaradas por la app son 20, 45, 40 y 18 s.
url: "https://pwa.productdesign.mx/app/?velocidad=rapida&camara=simulada&ubicacion=simulada"
pantalla: {selector: ".marco", atributo: "data-estado"}   # la URL no cambia: la app declara su pantalla en data-estado
pantalla_inicio: bienvenida
dispositivo: {emular: "Pixel 7", ancho: 412, alto: 839}   # celular Android emulado: toque, densidad y agente de usuario
visible: true            # ventana visible con subtítulos + sala de observación en vivo
observacion: true
video: true              # datos/videos/<sesión>.webm, con capítulos por paso
limpiar_datos: true      # cada sesión empieza como alguien que nunca abrió la app
max_pasos: 30
memoria: completa         # sus sesiones corrieron en modo completo; así se repiten igual
corridas: 2
baseline_url: null
sin_baseline_porque: "La línea base es la primera medición del benchmark (estudios/2026-10-22-ou2-descubrimiento, prototipo de Figma, mismo panel). La comparación entre las dos se hace en la narrativa, etapa por etapa."
max_sin_cambio: 4

# Datos claramente ficticios. Nunca datos personales reales.
datos_prueba:
  nombre: "Prueba"
  apellidos: "Ficticio Demo"
  celular: "5500000000"
  correo: "prueba@example.com"
  fecha_de_nacimiento: "15/05/1990"
  domicilio: "Calle Prueba 100, código postal 03100 (Ciudad de México)"
  estado_civil: "soltero(a)"
  ocupacion: "empleado(a)"   # agregados el 28/10/2026 tras T3-arturo (faltaban: el perfil no quiso inventarlos)
  codigo_de_verificacion: "el que te llegue en el mensaje"
  nota: "En esta prueba la cámara y la ubicación son simuladas: la app usa una foto de ejemplo en lugar de tu cámara. Es parte de la prueba, no una falla de tu teléfono."

# Ruta mecánica: lo que haría alguien que ya conoce el camino, por rol y texto. La usa `arnes tecnico` (auditoría sin
# perfiles, 0 tokens) y prepara las tareas que no empiezan en la bienvenida (`inicia_en`). No cuenta en las métricas
# de las tareas.
ruta_mecanica:
  - {nombre: "Inicia tu solicitud"}
  - {rol: radio, nombre: "Efectivo"}
  - {nombre: "Continuar"}
  - {nombre: "¿En cuántas semanas quieres pagar?"}
  - {rol: radio, nombre: "52 semanas"}
  - {nombre: "Continuar", ultimo: true}
  - {nombre: "Confirmar"}
  - {etiqueta: "¿Cómo prefieres que te llamemos?", llenar: "Prueba"}
  - {etiqueta: "¿Cuál es tu número celular?", llenar: "5500000000"}
  - {etiqueta: "¿Cuál es tu correo electrónico?", llenar: "prueba@example.com"}
  - {nombre: "Continuar"}
  - {selector: "input[autocomplete=one-time-code]", teclear_patron: "verificaci[oó]n[^0-9]*([0-9]{6})"}   # lo lee del mensaje simulado
  - {nombre: "¡Sigamos adelante!", timeout: 30000}
  - {rol: radio, nombre: "No", exacto: true}
  - {nombre: "Confirmar"}
  - {nombre: "Tomar foto"}
  - {nombre: "Continuar"}
  - {nombre: "Permitir", exacto: true}
  - {nombre: "Tomar selfie"}
  - {nombre: "¡Sigamos adelante!", timeout: 30000}
  - {nombre: "Continuar"}
  - {nombre: "Permitir", exacto: true}   # ubicación (app)
  - {nombre: "Permitir", exacto: true}   # ubicación (Incode)
  - {nombre: "Permitir", exacto: true}   # cámara (Incode)
  - {nombre: "Escanear", exacto: true}    # tutorial del frente
  - {nombre: "Escanear el reverso", timeout: 30000}
  - {nombre: "¡Sigamos adelante!", timeout: 45000}
  - {etiqueta: "Primer apellido", llenar: "Ficticio"}
  - {etiqueta: "Segundo apellido (opcional)", llenar: "Demo"}
  - {nombre: "Selecciona una opción"}
  - {rol: radio, nombre: "Soltero(a)"}
  - {nombre: "Continuar", ultimo: true}
  - {nombre: "Selecciona una opción"}
  - {rol: radio, nombre: "Empleado", exacto: true}
  - {nombre: "Continuar", ultimo: true}
  - {etiqueta: "Fecha de nacimiento", teclear: "15051990"}
  - {nombre: "Continuar", ultimo: true, timeout: 30000}
  - {nombre: "Continuar", timeout: 30000}
  - {rol: radio, nombre: "Sí", exacto: true}
  - {etiqueta: "Calle", llenar: "Calle Prueba"}
  - {etiqueta: "No. exterior", llenar: "100"}
  - {etiqueta: "Código postal", teclear: "03100"}
  - {nombre: "Confirmar", timeout: 20000}
  - {etiqueta: "Agrega las referencias para llegar", llenar: "Casa blanca con reja verde"}
  - {nombre: "No aplica"}
  - {nombre: "No aplica"}
  - {nombre: "No aplica"}
  - {nombre: "No aplica"}
  - {nombre: "Confirmar"}
  - {nombre: "Confirmar", timeout: 20000}
  - {nombre: "Sí, es mi fachada"}
  - {nombre: "Continuar", timeout: 60000}
  - {nombre: "Continuar"}
  - {rol: radio}
  - {rol: radio, nombre: "a.m."}
  - {nombre: "Confirmar"}
  - {rol: radio, nombre: "Viernes"}
  - {nombre: "Confirmar"}
  - {nombre: "Continuar", timeout: 30000}

tecnico:
  retoma_en: [otp, datosPersonales, oferta]   # recargar y volver a entrar en estos puntos
  cpu_ruta: 4

# Cuatro tareas por etapas: una sesión de 80 pasos costaría ≈ 21 M de tokens; por etapas, cada sesión arranca con
# contexto limpio. Las tareas 2–4 empiezan donde las deja la ruta mecánica (el perfil no hizo lo anterior: el
# escenario se lo cuenta). [SUPUESTO METODOLÓGICO]
tareas:
  - id: T1
    escenario: "Quieres un préstamo en efectivo y entraste desde tu celular a la app de Banco Azteca para pedirlo. Nadie te está ayudando: lo haces por tu cuenta."
    instruccion: "Pide un préstamo en efectivo: elige cuánto y en cuánto tiempo, deja tus datos de contacto y sigue hasta donde la app te pida tomarte una foto."
    exito: "Llega a «¡Empezamos con tu selfie!» habiendo elegido monto y plazo y verificado su celular."
    fin: {pantallas: [selfieIntro]}
    max_pasos: 26
    pasos_esperados: 18
    primer_toque: {etiqueta_contiene: "Inicia tu solicitud"}
  - id: T2
    inicia_en: selfieIntro
    escenario: "Ya elegiste tu préstamo en efectivo, dejaste tus datos y verificaste tu celular. Ahora la app te pide comprobar que eres tú. Tienes tu INE a la mano."
    instruccion: "Comprueba tu identidad con lo que la app te pida y sigue hasta que te pida confirmar tus datos personales."
    exito: "Llega a «Confirma tus datos»."
    fin: {pantallas: [datosPersonales]}
    primer_toque: {etiqueta_contiene: "Tomar foto"}
    max_pasos: 24
    pasos_esperados: 14
  - id: T3
    inicia_en: datosPersonales
    escenario: "Ya verificaste tu identidad con tu selfie y tu INE. Ahora la app te pide revisar tus datos y tu domicilio para evaluar tu solicitud."
    instruccion: "Revisa y completa tus datos y tu domicilio hasta que la app te diga cuánto te puede prestar."
    exito: "Llega a la oferta («te podemos prestar hasta…»)."
    fin: {pantallas: [oferta]}
    primer_toque: {etiqueta_contiene: "apellido"}   # el primer campo vacío
    max_pasos: 34
    pasos_esperados: 26
    retoma: {tras_paso: 10, modo: reabrir}   # a mitad de la tarea sale de la app y vuelve a entrar
  - id: T4
    inicia_en: oferta
    escenario: "La app ya evaluó tu solicitud y te muestra cuánto te puede prestar."
    instruccion: "Decide si aceptas la oferta y termina tu solicitud hasta donde la app te lleve."
    exito: "Llega a «Completaste tu solicitud» o a la encuesta final."
    fin: {pantallas: [completada, encuesta, gracias]}
    primer_toque: {etiqueta_contiene: "Continuar"}
    pregunta_cierre: "Terminaste tu solicitud. ¿Qué crees que pasa ahora con tu préstamo y cuándo tendrás tu dinero? ¿Qué harías después?"
    max_pasos: 18
    pasos_esperados: 10

# Hipótesis: H1 y H2 repiten las dos que se sostuvieron en la primera medición (prototipo); H3–H6 salen del
# recorrido mecánico de la PWA (28/10/2026).
hipotesis:
  - id: H1
    texto: "El simulador muestra solo el pago semanal y no el total a pagar: los perfiles confirman el préstamo sin saber cuánto pagarán en total (se repite el hallazgo principal del prototipo)."
    se_sostiene_si: "En al menos la mitad de las sesiones de T1 el perfil confirma el monto sin mencionar el total, o pregunta cuánto pagará en total."
    se_cae_si: "Las sesiones de T1 mencionan o encuentran el total antes de confirmar."
  - id: H2
    texto: "La autorización de consulta de buró va en letra chica debajo de «Continuar» en los datos de contacto: los perfiles continúan sin notar que la están dando."
    se_sostiene_si: "En la mayoría de las sesiones de T1 el perfil toca «Continuar» en contacto sin mencionar el buró o el historial crediticio."
    se_cae_si: "La mayoría lo menciona antes de continuar."
  - id: H3
    texto: "La verificación de identidad pide cinco permisos (cámara y ubicación en la selfie; ubicación, ubicación otra vez y cámara en la INE, dos con un dominio externo): la confianza cae en la etapa de la INE, más en Gen X y Boomer."
    se_sostiene_si: "La confianza baja 15 puntos o más en alguna pantalla de permisos de T2, o algún perfil niega un permiso o comenta que ya lo había dado."
    se_cae_si: "La confianza se mantiene en todas las pantallas de permisos de T2."
  - id: H4
    texto: "«Confirma tus datos» dice que la información debe coincidir con la INE, pero muestra vacíos los apellidos y la fecha de nacimiento: los perfiles esperan que la app los haya tomado de la INE."
    se_sostiene_si: "Algún perfil comenta que la app ya debería tener esos datos o duda de si la INE se leyó bien."
    se_cae_si: "Todos llenan los campos sin comentarlo."
  - id: H5
    texto: "Hasta el domicilio no hay indicador de progreso: en T1 y T2 los perfiles dicen no saber cuánto les falta más seguido que en T3, donde ya aparece la barra."
    se_sostiene_si: "La proporción de pasos con progreso «no» o «más o menos» es mayor en T1 y T2 que en T3."
    se_cae_si: "La proporción es igual o menor en T1 y T2."
  - id: H6
    texto: "Al terminar, los perfiles no saben cuándo tendrán su dinero: la oferta dice «sujeto a aprobación» y el préstamo depende de una visita."
    se_sostiene_si: "En la pregunta de cierre de T4 la mitad o más de las sesiones no puede decir cuándo recibe el dinero o lo dice mal."
    se_cae_si: "La mayoría explica que primero viene la visita y después el depósito."
