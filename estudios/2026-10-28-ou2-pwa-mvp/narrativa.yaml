momentos:
  - {pantalla: "Monto y plazo", tipo: rojo, texto: "Confianza media 56, mínima 45; fricción 3 o más en 10 observaciones. Itzel: «$217 sí lo aguanto. Pero son 128 semanas y nadie me dice cuánto termino pagando»."}
  - {pantalla: "Permiso de ubicación (Incode)", tipo: rojo, texto: "Confianza media 41, la caída más fuerte de T2. Bryan: «Ya no se ve del banco y nadie me avisó que iba a salir de la app. No le doy mi ubicación a un dominio que no conozco»."}
  - {pantalla: "Día de pago y contrato", tipo: rojo, texto: "Confianza media 54, mínima 28 (la más baja del flujo). Itzel abandona dos veces: el pago es «aproximado» y el total, en la visita."}
  - {pantalla: "Datos de contacto", tipo: amarillo, texto: "Mínima 25. El buró se autoriza al continuar y su enlace abre la página de inicio del banco."}
  - {pantalla: "Agenda la visita", tipo: amarillo, texto: "«¿Una visita? Yo quería resolverlo desde el celular» (Itzel, Bryan)."}
  - {pantalla: "Código de verificación", tipo: verde, texto: "El SMS llega con autollenado y el código se valida solo: «Qué bien, llegó el código al momento» (Bryan). Corrige el atasco del prototipo."}
  - {pantalla: "Verificar domicilio", tipo: verde, texto: "Confianza media 72, la más alta del flujo: anuncia la etapa y lo que viene."}
hipotesis_resultado:
  - {id: H1, estado: se_sostiene, evidencia: "8 de 8 sesiones de T1 buscan el total en el simulador y no lo encuentran; vuelven a buscarlo en el contrato en 8 de 8 sesiones de T4."}
  - {id: H2, estado: se_cae, evidencia: "No pasa inadvertida: 8 de 8 sesiones de T1 notan la letra chica del buró. Lo que pasa es que la saltan sin leerla («Ni me puse a leer la letra chiquita»), o, como Itzel, intentan leerla y el enlace abre la página de inicio del banco."}
  - {id: H3, estado: se_sostiene, evidencia: "En 8 de 8 sesiones de T2 la confianza cae 12 a 26 puntos sobre una escala de 0 a 100 en el permiso de ubicación de Incode (de 52–66 a 35–45). Bryan lo niega en sus dos corridas; Arturo: «Ya van tres veces que piden la ubicación y ahora es otro nombre». No hay diferencia clara por generación: cae en los cuatro perfiles."}
  - {id: H4, estado: se_sostiene, evidencia: "8 de 8 sesiones de T3 comentan que «debe coincidir con la INE» pero los apellidos y la dirección vienen vacíos; Rosalba: «Raro que no la traiga de la INE, pero la escribo yo»."}
  - {id: H5, estado: se_cae, evidencia: "No hay diferencia: «no» o «más o menos» en 127 de 127 respuestas de T1, 103 de 106 de T2 y 232 de 233 de T3. La barra del domicilio se ve (6 de 8 sesiones de T3), pero mide la etapa, no el proceso, y arranca vacía."}
  - {id: H6, estado: se_cae, evidencia: "De las 6 sesiones que terminan T4, las 6 explican que primero viene la visita y después, si aprueban, el dinero; ninguna sabe cuándo llega ni cuánto pagará en total. Las 2 de Itzel abandonan antes."}
perfiles:
  bryan: {cita: "Ya no se ve del banco y nadie me avisó que iba a salir de la app.", entiende: "Lo rápido del código y el orden del flujo.", rompe: "Dominios que no son del banco, tocar algo que no responde (la moto en la oferta) y una barra que vuelve a empezar."}
  itzel: {cita: "Son 52 semanas de $728, unos $37,800 por $22,000, y eso lo saqué yo.", entiende: "Que agendar la visita no es firmar.", rompe: "No ver el total en ningún momento; abandona en el contrato las dos veces."}
  rosalba: {cita: "Eso es una posada, no mi casa. No voy a decir que sí solo para avanzar.", entiende: "Las pantallas con letra grande y la etapa de domicilio.", rompe: "Confirmar algo que no es cierto; la letra chica del contrato."}
  arturo: {cita: "Ya van tres veces que piden la ubicación y ahora es otro nombre.", entiende: "Para qué son la selfie y la INE.", rompe: "Datos que no sabe para qué se piden (estado civil) y el mapa que no puede leer."}
hallazgos:
  - id: H1
    titulo: "El costo total del préstamo no aparece en ningún momento: ni al elegir el plazo ni en el contrato"
    severidad: 4
    categoria: A
    oportunidad: incorporar
    donde: "Monto y plazo; Día de pago y contrato"
    pantalla: simulador
    sesiones: [T1-arturo-1, T1-arturo-2, T1-bryan-1, T1-bryan-2, T1-itzel-1, T1-itzel-2, T1-rosalba-1, T1-rosalba-2, T4-arturo-1, T4-arturo-2, T4-bryan-1, T4-bryan-2, T4-itzel-1, T4-itzel-2, T4-rosalba-1, T4-rosalba-2]
    impacto_negocio: 5
    walkthrough: 3
    hallazgo: "En el simulador solo aparece el pago semanal («$0 Pesos» hasta elegir plazo) y la lista de plazos empieza en 128 semanas. 8 de 8 sesiones de T1 buscan el total y no lo encuentran; es la pantalla con más fricción alta de T1 (10 observaciones con fricción 3 o más). En el contrato de «Día de pago» el pago dice «aproximado» y tampoco hay total: 8 de 8 sesiones de T4 lo buscan e Itzel abandona en sus dos corridas (confianza 28)."
    interpretacion: "La decisión de endeudarse se toma dos veces sin el dato que la sostiene. Quien hace la cuenta (Itzel: $37,800 por $22,000) pierde la confianza justo antes de aceptar; quien no la hace acepta sin saber. Es el hallazgo principal de la primera medición y sigue abierto en la PWA."
    recomendacion: "Mostrar junto al pago semanal el total a pagar y el número de pagos, que cambien con el plazo; repetirlos en el contrato con su CAT, y no presentar el pago como «aproximado» sin decir de qué depende."
    evidencia: "Pensamientos de simulador (T1) y diaPago (T4) · abandonos T4-itzel-1 y T4-itzel-2 · auditoría: «$0 Pesos» con 3 de 3 evaluadores (N1, severidad 3)."
    heuristica: "Nielsen 1 · Visibilidad del estado del sistema; Nielsen 2 · Relación con el mundo real"
    confianza: alta
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [decision, confianza]
    validacion: "Si mostrar el total y el número de pagos en el simulador y en el contrato cambia la elección de plazo y la disposición a aceptar."
  - id: H2
    titulo: "El tercer permiso de ubicación llega desde un dominio que no es del banco y la confianza cae 20 puntos"
    severidad: 3
    categoria: A
    oportunidad: hacer_diferente
    donde: "INE · permisos de Incode"
    pantalla: incodeUbicacion
    sesiones: [T2-arturo-1, T2-arturo-2, T2-bryan-1, T2-bryan-2, T2-itzel-1, T2-itzel-2, T2-rosalba-1, T2-rosalba-2]
    impacto_negocio: 4
    walkthrough: 2
    hallazgo: "La identidad pide cinco permisos: cámara y ubicación en la selfie y, en la INE, ubicación (app), ubicación y cámara (Incode, con «identidad-digital-ocrdual.com.mx»). En el permiso de ubicación de Incode la confianza baja de 52–66 a 35–45 en 8 de 8 sesiones de T2 y la fricción media es 3.2. Bryan lo niega en sus dos corridas y pasa por «cámara negada»."
    interpretacion: "La repetición se lee como insistencia y el cambio de dominio como salir del banco. Lo que sostiene la confianza en la selfie (explicar para qué) no se repite en la INE."
    recomendacion: "Pedir la ubicación una sola vez y reutilizarla; anunciar antes de la INE que la verificación la hace un proveedor del banco, con su nombre, y explicar para qué es cada permiso. Si el dominio no puede cambiar, mostrar la marca del banco en esa pantalla."
    evidencia: "Pensamientos de incodeUbicacion e incodeCamara · auditoría: N2 y N5 con 3 de 3 evaluadores · contraste insuficiente de «No permitir» (axe, 1.4.3)."
    heuristica: "Nielsen 2 · Relación con el mundo real; Nielsen 5 · Prevención de errores"
    wcag: "1.4.3"
    confianza: alta
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [confianza, continuidad]
    validacion: "Si anunciar al proveedor y pedir la ubicación una sola vez reduce la caída de confianza y las negativas."
  - id: H3
    titulo: "El buró se autoriza al continuar y su enlace abre la página de inicio del banco, no el documento"
    severidad: 3
    categoria: A
    oportunidad: hacer_diferente
    donde: "Datos de contacto, pie de pantalla"
    pantalla: contacto
    sesiones: [T1-arturo-1, T1-arturo-2, T1-bryan-1, T1-bryan-2, T1-itzel-1, T1-itzel-2, T1-rosalba-1, T1-rosalba-2]
    impacto_negocio: 4
    walkthrough: 3
    hallazgo: "«Al continuar, aceptas el Aviso de Privacidad y autorizas la Consulta de Historial Crediticio…» va en letra chica bajo el botón. 8 de 8 sesiones de T1 la notan; la mayoría la salta sin leer. Los tres enlaces abren bancoazteca.com.mx en otra pestaña. Itzel intenta leer el de buró, ve la página de inicio y abandona: «No voy a firmar algo que no pude leer». Confianza mínima de la pantalla: 25."
    interpretacion: "La autorización más sensible sigue implícita, como en el prototipo. En el MVP, además, el documento no existe: quien quiere leer antes de aceptar no puede."
    recomendacion: "Separar la autorización de buró en una casilla explícita con una frase legible de para qué se consulta, después de mostrar el total; conectar el enlace al texto real."
    evidencia: "Pensamientos de contacto (T1) · T1-itzel-2 (pestaña nueva con «Banco Azteca, tu banca en línea») · primera medición, hallazgo H2."
    heuristica: "Nielsen 1 · Visibilidad del estado del sistema"
    confianza: alta
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [comprension, confianza]
    validacion: "Si las personas entienden qué autorizan y si una casilla explícita, con el documento real, cambia la decisión."
  - id: H4
    titulo: "La visita a domicilio aparece hasta el final, como sorpresa"
    severidad: 3
    categoria: A
    oportunidad: mejorar
    donde: "Agenda la visita"
    pantalla: agendaIntro
    sesiones: [T4-bryan-1, T4-bryan-2, T4-itzel-1, T4-itzel-2]
    impacto_negocio: 4
    walkthrough: 1
    hallazgo: "Después de la oferta, «agenda una visita para confirmar tu solicitud». 4 de 8 sesiones de T4 lo dicen así: «¿Una visita? Yo quería resolverlo desde el celular». La confianza en la agenda baja a 40 en las sesiones de Itzel y Bryan, y «7 de cada 10 personas usan su préstamo el mismo día» se lee como presión."
    interpretacion: "La app se presenta como «de punta a punta desde tu celular». Si el préstamo depende de una visita, saberlo hasta el final rompe la expectativa y retrasa la decisión."
    recomendacion: "Anunciar la visita desde la bienvenida o el simulador (qué es, cuánto dura, para qué) y repetirlo antes de la oferta."
    evidencia: "Pensamientos de agendaIntro y agendaDiaHora (T4)."
    heuristica: "Nielsen 2 · Relación con el mundo real"
    confianza: media
    etiquetas: [SIMULACIÓN]
    impacto_usuario: [confianza, decision]
    validacion: "Si anunciar la visita al inicio cambia la intención de terminar la solicitud."
  - id: H5
    titulo: "Los perfiles no saben cuánto les falta: la barra aparece hasta el domicilio y arranca vacía en cada etapa"
    severidad: 2
    categoria: A
    oportunidad: mejorar
    donde: "Todo el flujo"
    pantalla: direccion
    sesiones: [T3-arturo-1, T3-bryan-1, T3-bryan-2, T3-itzel-1, T3-rosalba-1, T3-rosalba-2]
    impacto_negocio: 3
    walkthrough: 4
    hallazgo: "La bienvenida promete «4 pasos»; la ruta mínima son 59 acciones en 30 pantallas. En T1–T3, 462 de 466 respuestas dicen no saber, o saber más o menos, en qué parte van. La barra «Tu domicilio» se nota (6 de 8 sesiones de T3), pero mide la etapa: «La barra casi vacía… otra vez a empezar» (Bryan)."
    interpretacion: "Una barra por etapa que vuelve a cero confirma que falta mucho sin decir cuánto. La promesa de 4 pasos sigue sin corresponder al recorrido."
    recomendacion: "Un indicador global de pocos pasos con nombre («Paso 3 de 5 · Tu domicilio») en todo el flujo, o ajustar la promesa de la bienvenida."
    evidencia: "Métrica «sabe dónde va» · pensamientos de direccion y domicilioInicio (T3) · primera medición, hallazgo H3."
    heuristica: "Nielsen 1 · Visibilidad del estado del sistema"
    confianza: alta
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [esfuerzo, confianza]
    validacion: "Si un indicador global reduce la sensación de proceso largo."
  - id: H6
    titulo: "«Confirma tus datos» pide coincidir con la INE, pero no trae lo que la INE acaba de leer"
    severidad: 2
    categoria: A
    oportunidad: incorporar
    donde: "Confirma tus datos; Confirma tu dirección"
    pantalla: datosPersonales
    sesiones: [T3-arturo-1, T3-arturo-2, T3-bryan-1, T3-bryan-2, T3-itzel-1, T3-itzel-2, T3-rosalba-1, T3-rosalba-2]
    impacto_negocio: 3
    walkthrough: 3
    hallazgo: "8 de 8 sesiones de T3 notan que los apellidos, la fecha y la dirección vienen vacíos después de escanear la INE. T3 es la tarea más larga (mediana de 28 pasos, 14 campos) y la de menor facilidad percibida (CES 4.5). Estado civil y ocupación se piden sin decir para qué (Arturo, dos corridas)."
    interpretacion: "Escanear la INE y luego escribir lo mismo se siente como trabajo doble; la frase «debe coincidir con tu INE» lo hace evidente."
    recomendacion: "Prellenar con lo leído de la INE y pedir solo confirmar; explicar en una línea para qué se piden estado civil y ocupación."
    evidencia: "Pensamientos de datosPersonales y direccion (T3) · CES de T3 · historial: T3-arturo con datos de prueba incompletos."
    heuristica: "Nielsen 7 · Flexibilidad y eficiencia"
    confianza: alta
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [esfuerzo]
    validacion: "Si prellenar desde la INE reduce el tiempo y los errores del formulario."
