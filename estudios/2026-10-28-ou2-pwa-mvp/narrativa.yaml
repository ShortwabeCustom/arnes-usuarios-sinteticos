    impacto_negocio: 2
    walkthrough: 3
    hallazgo: "La foto de ejemplo parece un hotel. 8 de 8 sesiones de T3 lo comentan; 7 confirman «para avanzar» y Rosalba se niega («No voy a decir que sí solo para avanzar») y, al elegir «No es mi fachada», vuelve al mapa sin explicación. No llega a la oferta."
    interpretacion: "La foto es de ejemplo (va en estado de prototipado). Lo que es diseño: no se dice qué pasa al elegir «No», y por eso confirmar algo falso «para avanzar» parece la única salida."
    recomendacion: "Explicar qué pasa si no es tu fachada (ajustar el pin, continuar sin foto) y usar la imagen real de la dirección."
    evidencia: "Pensamientos de fachada (T3) · T3-rosalba-2 · auditoría: N3 con 3 de 3 evaluadores."
    heuristica: "Nielsen 3 · Control y libertad"
    confianza: media
    etiquetas: [EVIDENCIA, SIMULACIÓN]
    impacto_usuario: [confianza, continuidad]
    validacion: "Si con la foto real y una salida clara para «No» la confirmación deja de ser un trámite."
