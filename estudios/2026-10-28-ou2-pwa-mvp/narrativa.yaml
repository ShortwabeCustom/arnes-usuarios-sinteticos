positivos:
  - "El código de verificación llega con autollenado y se valida solo: 7 de 7 sesiones que llegan lo resuelven en un paso. En el prototipo era el punto donde todos esperaban sin saber qué tocar."
  - "El primer toque es el esperado en 30 de 32 sesiones: «Inicia tu solicitud», «Tomar foto», el primer apellido y «Continuar» se encuentran sin dudar."
  - "La retoma funciona: al salir y volver a entrar a mitad de T3, la app conserva el avance en 8 de 8 sesiones («Qué bueno que no perdí lo que llené»)."
  - "Rendimiento de laboratorio en rango bueno: LCP 2.4 s y CLS 0 con red móvil lenta, 667 KB, sin errores de JavaScript; funciona sin conexión y es instalable."
  - "«Verificar domicilio» tiene la confianza más alta del flujo (72): anuncia la etapa y lo que viene."
  - "La introducción a la selfie explica para qué es la foto y la confianza se sostiene en sus permisos (64 de media)."
limitaciones:
  - "32 sesiones sintéticas (4 perfiles × 4 tareas × 2 corridas), no personas. 4 de 16 perfil-tareas cambian de resultado entre corridas: se reporta lo que se repite."
  - "Las tareas 2–4 empiezan a mitad del flujo, llevadas por la ruta mecánica (52 semanas, $22,000 en efectivo): el perfil no eligió esas condiciones. Itzel lo señala en T4 («no pude escoger monto ni plazo»)."
  - "MVP sin reglas de negocio: servicios simulados y escenario feliz (OTP correcto, selfie e INE válidas, evaluación aprobada). Las ramas de error no se recorrieron."
  - "Cámara y ubicación simuladas: la app dice «No encontramos una cámara»; 8 de 8 sesiones de T2 lo notan y siguen porque se les avisó. Esa leyenda no existe en producción."
  - "Celular emulado (Pixel 7) y esperas aceleradas ×10; el rendimiento es de laboratorio."
  - "Los datos de prueba no traían estado civil ni ocupación hasta que T3-arturo abandonó por eso (historial); 3 sesiones de T3 corrieron sin esos datos y eligieron una opción por su cuenta."
limitaciones_tecnicas:
  - "Fallas del instrumento resueltas antes del panel (historial): el SMS pasajero no llegaba al perfil, «esperar» no esperaba, el deslizamiento no movía la hoja de plazos y el campo del código (transparente) no era tocable."
  - "Fallas durante el panel (historial): el enlace de buró partido en dos líneas no era tocable en 7 de 8 sesiones de T1 (todas menos T1-itzel-2, que se repitió con la corrección); el límite de la suscripción cortó 4 sesiones, que se repitieron; T3-arturo-2 se reclasificó porque su último paso llevó a la oferta."
  - "La auditoría experta (3 evaluadores, 30 pantallas) usa las capturas de la ruta mecánica, no las de las sesiones."
estado_prototipado:
  - "Los enlaces legales (aviso de privacidad, buró, información laboral) abren la página de inicio del banco: el documento no está conectado."
  - "Tocar otra categoría en la oferta («$25,000 en Motocicletas») no responde (Bryan, dos corridas)."
  - "La foto de fachada es de ejemplo y parece un hotel."
  - "Cámara y ubicación simuladas; la leyenda «No encontramos una cámara» es del modo de prueba."
aprendizajes_metodo:
  - "En una app real hay avisos que duran segundos (un SMS simulado). Como el perfil tarda unos 20 s en decidir, el arnés vigila 3 s después de cada acción y le cuenta lo que apareció y se fue."
  - "Un campo transparente encima de casillas (código de 6 dígitos) es un objetivo real: el detector lo cuenta si recibe el toque. Un enlace partido en dos líneas se prueba línea por línea."
  - "Los datos de prueba deben cubrir todo lo que el formulario pide: un perfil que no inventa datos abandona, y eso mide el instrumento, no el producto."
  - "La ruta mecánica sirve tres veces: auditoría técnica sin tokens, preparación de tareas a mitad del flujo y revisión de que cada objetivo sea tocable antes de gastar."
  - "Cuatro perfiles en paralelo funcionan; el límite de la sesión de la suscripción puede cortar el panel: el arnés retoma sin repetir lo hecho."
