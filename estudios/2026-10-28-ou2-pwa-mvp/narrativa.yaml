titular: "La PWA se recorre de punta a punta, pero el costo total del préstamo no aparece en ningún momento: 8 de 8 sesiones lo buscan al elegir el plazo y 8 de 8 al aceptar el contrato"
veredicto: >-
  Los cuatro perfiles llegan de la bienvenida a la verificación del celular (7 de 8 sesiones), completan selfie e INE
  (8 de 8), llenan datos y domicilio hasta la oferta (7 de 8) y terminan la solicitud (6 de 8). La técnica responde:
  carga en 2.4 s en red móvil lenta, funciona sin conexión y conserva el avance al salir y volver. Lo que frena es de
  información y de confianza: el total a pagar no aparece ni en el simulador ni en el contrato (el pago es
  «aproximado»), el permiso de ubicación se pide por tercera vez desde un dominio que no es del banco, y la visita a
  domicilio aparece al final como sorpresa. Frente al prototipo, se corrigió el código de verificación y se conectó la
  rama sin asesor; siguen abiertos el total, el buró y la ubicación en el proceso. Son hipótesis para validar con personas.
decision:
  - {texto: "El flujo completo se puede recorrer sin ayuda en la PWA", si: true}
  - {texto: "Mostrar el total a pagar y el número de pagos antes de confirmar el plazo y en el contrato", si: true}
  - {texto: "Dar por resueltos los permisos de identidad tal como están (5 permisos, dos desde un dominio externo)", si: false}
  - {texto: "Mantener la visita a domicilio sin anunciarla antes de la oferta", si: false}
kpis:
  - {valor: "6 de 8", etiqueta: "sesiones de T1 llegan a la selfie con fricción", detalle: "Una llega sin fricción y una abandona en el consentimiento de buró. La fricción se concentra en el simulador (sin total) y en los datos de contacto.", tono: duda, verificar: "T1|exito_con_friccion"}
  - {valor: "8 de 8", etiqueta: "sesiones de T2 completan la identidad con fricción", detalle: "La confianza cae unos 20 puntos en el permiso de ubicación de Incode, que llega desde otro dominio y por tercera vez.", tono: duda, verificar: "T2|exito_con_friccion"}
  - {valor: "2 de 8", etiqueta: "sesiones de T4 abandonan en el contrato", detalle: "Itzel, las dos veces: el pago es «aproximado», no hay total y el costo real se lo darían en la visita.", tono: mal, verificar: "T4|abandono"}
  - {valor: "16.5", etiqueta: "pasos de la bienvenida a la selfie (mediana)", detalle: "La bienvenida promete «4 pasos»; el flujo completo son 59 acciones en la ruta mínima y 30 pantallas.", tono: duda, verificar: "metrica|T1|pasos"}
  - {valor: "4.5", etiqueta: "facilidad percibida en datos y domicilio (CES 1–7, mediana)", detalle: "La más baja de las cuatro tareas; en T1, T2 y T4 la mediana es 5.", tono: duda, verificar: "metrica|T3|ces"}
kpis_nota: "Corridas de perfiles sintéticos (4 perfiles × 4 tareas × 2 corridas = 32 sesiones), no personas. Las cifras de calidad técnica son mediciones del producto en un celular emulado (arnes tecnico)."
resumen:
  - "En 8 de 8 sesiones de T1 el perfil busca el total a pagar en el simulador y no lo encuentra; con 128 semanas como primera opción, varios hacen la cuenta solos. En 8 de 8 sesiones de T4 lo vuelven a buscar al aceptar el contrato, donde el pago semanal dice «aproximado»."
  - "Itzel abandona T4 en las dos corridas en «Día de pago»: «Son 52 semanas de $728, unos $37,800 por $22,000, y eso lo saqué yo. El costo total me lo darán en mi casa». Es la confianza más baja del flujo (28)."
  - "La verificación de identidad pide cinco permisos. En el tercero de ubicación, ahora desde «identidad-digital-ocrdual.com.mx», la confianza cae de alrededor de 60 a 40 en 8 de 8 sesiones de T2; Bryan lo niega en sus dos corridas (pasa por «cámara negada» y luego acepta)."
  - "La autorización de buró sigue implícita al tocar «Continuar». 8 de 8 sesiones de T1 la notan, la mayoría no la lee («Ni me puse a leer la letra chiquita») y el enlace «Consulta de Historial Crediticio» abre la página de inicio del banco, no el documento: Itzel se detiene ahí."
  - "La visita a domicilio aparece hasta la agenda. 4 de 8 sesiones de T4 lo dicen así: «Yo quería resolverlo desde el celular»."
  - "Saber dónde va: en T1–T3, 462 de 466 respuestas dicen «no» o «más o menos». La barra de progreso del domicilio se nota (6 de 8 sesiones de T3 la mencionan), pero arranca vacía por etapa: «La barra casi vacía… otra vez a empezar» (Bryan)."
  - "En «Confirma tus datos» 8 de 8 sesiones de T3 notan que la app pide coincidir con la INE pero no trae los apellidos ni la dirección que acaba de leer."
  - "La foto de fachada de ejemplo parece un hotel: 8 de 8 sesiones de T3 lo comentan; 7 confirman «para avanzar» y Rosalba se niega en una corrida y no llega a la oferta."
  - "Técnica: carga en 2.4 s (LCP) con red móvil lenta, 667 KB, funciona sin conexión y conserva el avance al volver (8 de 8 sesiones de T3). Accesibilidad automática (WCAG 2.2 AA): 21 de 30 pantallas sin fallas; contraste insuficiente en 7 (los botones «No permitir», el contador del código) y carruseles sin teclado."
  - "Frente al prototipo (primera medición): el código de verificación ya no se atora (se valida solo y el SMS ofrece autollenado; 7 de 7 lo resuelven en un paso) y la rama sin asesor ya existe; siguen el total, el buró y la ubicación en el proceso."
