<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Personas recorren una solicitud desde su celular</title>
  <desc id="desc">Cuatro figuras dibujadas en azul caminan en diferentes direcciones mientras consultan su teléfono. La animación se repite de forma continua.</desc>
  <style>
    :root{--line:#3048b5;--pale:#e0e6fa;--mid:#aebcec;--dark:#1e328f}
    .route{fill:none;stroke:#cbd5f3;stroke-width:1.5;stroke-dasharray:5 9;stroke-linecap:round}
    .route-dot{fill:#fff;stroke:#9badde;stroke-width:2}
    .person{stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .skin{fill:#fff}.coat{fill:var(--pale)}.coat2{fill:var(--mid)}.ink{fill:var(--line)}.none{fill:none}
    .leg-one,.leg-two,.free-arm{transform-box:fill-box}
    .leg-one{transform-origin:100% 0;animation:step-one .78s ease-in-out infinite alternate}
    .leg-two{transform-origin:0 0;animation:step-two .78s ease-in-out infinite alternate}
    .free-arm{transform-origin:100% 0;animation:arm-step .78s ease-in-out infinite alternate}
    .body-bob{animation:bob .39s ease-in-out infinite alternate}
    .phone-glow{fill:#b9c8f4;opacity:.32;animation:glow 2.4s ease-in-out infinite}
    .walk-a{animation:across-a 21s linear infinite;animation-delay:-7s}
    .walk-b{animation:across-b 25s linear infinite;animation-delay:-10s}
    .walk-c{animation:across-c 19s linear infinite;animation-delay:-13s}
    .walk-d{animation:across-d 23s linear infinite;animation-delay:-4s}
    @keyframes step-one{from{transform:rotate(-19deg)}to{transform:rotate(19deg)}}
    @keyframes step-two{from{transform:rotate(19deg)}to{transform:rotate(-19deg)}}
    @keyframes arm-step{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
    @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
    @keyframes glow{0%,100%{opacity:.16}50%{opacity:.42}}
    @keyframes across-a{from{transform:translate(-150px,366px)}to{transform:translate(890px,366px)}}
    @keyframes across-b{from{transform:translate(870px,250px)}to{transform:translate(-145px,250px)}}
    @keyframes across-c{from{transform:translate(-130px,78px)}to{transform:translate(850px,78px)}}
    @keyframes across-d{from{transform:translate(850px,412px)}to{transform:translate(-125px,412px)}}
    @media(prefers-reduced-motion:reduce){.walk-a,.walk-b,.walk-c,.walk-d,.leg-one,.leg-two,.free-arm,.body-bob,.phone-glow{animation:none!important}.walk-a{transform:translate(180px,366px)}.walk-b{transform:translate(540px,250px)}.walk-c{transform:translate(335px,78px)}.walk-d{transform:translate(690px,412px)}}
  </style>

  <path class="route" d="M-20 216 C170 200 290 224 420 212 S630 198 790 216"/>
  <path class="route" d="M-20 407 C190 414 350 399 525 416 S650 424 790 407"/>
  <path class="route" d="M-20 526 C195 518 320 536 470 525 S620 523 790 529"/>
  <circle class="route-dot" cx="120" cy="211" r="5"/><circle class="route-dot" cx="525" cy="415" r="5"/><circle class="route-dot" cx="625" cy="526" r="5"/>

  <!-- A young adult moving right, checking a phone. -->
  <g class="walk-a"><g transform="scale(1.14)" class="person">
    <g transform="translate(-5 73)"><g class="leg-one"><path d="M0 0 L-4 43 L-18 62" class="none" stroke-width="7"/><path d="M-18 62 L-31 63" class="none" stroke-width="5"/></g></g>
    <g transform="translate(6 73)"><g class="leg-two"><path d="M0 0 L8 42 L25 61" class="none" stroke-width="7"/><path d="M25 61 L38 61" class="none" stroke-width="5"/></g></g>
    <g class="body-bob"><path d="M-14 22 Q-6 17 0 19 Q9 16 17 23 L13 77 L-13 77 Z" class="coat"/><path d="M-3 23 L-3 70" class="none" stroke-width="1.5"/>
      <g transform="translate(-13 26)"><g class="free-arm"><path d="M0 0 L-9 28 L-4 48" class="none" stroke-width="6"/><circle cx="-4" cy="48" r="3" class="skin"/></g></g>
      <path d="M15 27 L26 42 L14 48" class="none" stroke-width="6"/><circle cx="14" cy="48" r="3" class="skin"/>
      <circle class="phone-glow" cx="12" cy="36" r="19" stroke="none"/><rect x="4" y="23" width="11" height="23" rx="2" class="ink"/><path d="M7 27 H12" class="none" stroke="#fff" stroke-width="1"/>
      <path d="M-7 12 L-5 20 M7 12 L5 20" class="none"/><circle cx="0" cy="0" r="14" class="skin"/>
      <path d="M-13 -3 Q-17 -19 -5 -22 Q11 -25 15 -10 L13 -3 Q10 -12 5 -13 Q-1 -5 -13 -3Z" class="ink"/><circle cx="6" cy="1" r="1" class="ink" stroke="none"/>
    </g>
  </g></g>

  <!-- A woman walking in the opposite direction. -->
  <g class="walk-b"><g transform="scale(-1.07 1.07)" class="person">
    <g transform="translate(-6 78)"><g class="leg-one"><path d="M0 0 L-8 42 L-24 61" class="none" stroke-width="7"/><path d="M-24 61 L-36 61" class="none" stroke-width="5"/></g></g>
    <g transform="translate(6 78)"><g class="leg-two"><path d="M0 0 L9 41 L24 61" class="none" stroke-width="7"/><path d="M24 61 L36 62" class="none" stroke-width="5"/></g></g>
    <g class="body-bob"><path d="M-13 24 Q0 16 13 24 L17 78 L-16 78 Z" class="coat2"/><path d="M-15 67 Q0 73 16 67" class="none" stroke-width="1.4"/>
      <g transform="translate(-13 27)"><g class="free-arm"><path d="M0 0 L-10 25 L-5 45" class="none" stroke-width="6"/><circle cx="-5" cy="45" r="3" class="skin"/></g></g>
      <path d="M13 28 L25 45 L10 48" class="none" stroke-width="6"/><circle cx="10" cy="48" r="3" class="skin"/>
      <circle class="phone-glow" cx="9" cy="35" r="19" stroke="none"/><rect x="2" y="23" width="11" height="23" rx="2" class="ink"/><path d="M5 27 H10" class="none" stroke="#fff" stroke-width="1"/>
      <path d="M-6 13 L-5 21 M6 13 L5 21" class="none"/><circle cx="0" cy="0" r="14" class="skin"/>
      <circle cx="-11" cy="-16" r="7" class="ink"/><path d="M-14 -4 Q-16 -18 -4 -20 Q10 -22 14 -7 L11 -4 Q8 -11 2 -13 Q-2 -6 -14 -4Z" class="ink"/><circle cx="5" cy="2" r="1" class="ink" stroke="none"/>
    </g>
  </g></g>

  <!-- A smaller older adult on the far lane. -->
  <g class="walk-c"><g transform="scale(.88)" class="person">
    <g transform="translate(-5 75)"><g class="leg-one"><path d="M0 0 L-5 41 L-18 61" class="none" stroke-width="7"/><path d="M-18 61 L-30 61" class="none" stroke-width="5"/></g></g>
    <g transform="translate(6 75)"><g class="leg-two"><path d="M0 0 L7 42 L23 61" class="none" stroke-width="7"/><path d="M23 61 L36 61" class="none" stroke-width="5"/></g></g>
    <g class="body-bob"><path d="M-14 24 Q-7 18 0 19 Q8 17 15 24 L14 76 L-15 76 Z" class="coat"/><path d="M-11 27 L-15 64 M11 28 L15 65" class="none" stroke-width="1.4"/>
      <g transform="translate(-13 28)"><g class="free-arm"><path d="M0 0 L-8 24 L-4 46" class="none" stroke-width="6"/><circle cx="-4" cy="46" r="3" class="skin"/></g></g>
      <path d="M13 29 L23 44 L10 48" class="none" stroke-width="6"/><circle cx="10" cy="48" r="3" class="skin"/>
      <circle class="phone-glow" cx="9" cy="36" r="19" stroke="none"/><rect x="2" y="24" width="11" height="23" rx="2" class="ink"/><path d="M5 28 H10" class="none" stroke="#fff" stroke-width="1"/>
      <path d="M-6 13 L-5 21 M6 13 L5 21" class="none"/><circle cx="0" cy="0" r="14" class="skin"/>
      <path d="M-14 -3 Q-15 -18 -4 -20 Q11 -22 14 -7 L12 -3 Q10 -10 3 -11 Q-5 -8 -14 -3Z" class="ink"/><path d="M-15 -10 Q-22 -8 -20 1" class="none"/><circle cx="6" cy="2" r="1" class="ink" stroke="none"/>
    </g>
  </g></g>

  <!-- A fourth person crosses the lower route in the other direction. -->
  <g class="walk-d"><g transform="scale(-.78 .78)" class="person">
    <g transform="translate(-5 74)"><g class="leg-one"><path d="M0 0 L-7 42 L-24 61" class="none" stroke-width="8"/><path d="M-24 61 L-37 61" class="none" stroke-width="5"/></g></g>
    <g transform="translate(6 74)"><g class="leg-two"><path d="M0 0 L9 42 L25 61" class="none" stroke-width="8"/><path d="M25 61 L38 62" class="none" stroke-width="5"/></g></g>
    <g class="body-bob"><path d="M-16 24 Q0 17 16 24 L14 75 L-15 75 Z" class="coat2"/><path d="M-12 48 L13 48" class="none" stroke-width="1.3"/>
      <g transform="translate(-15 27)"><g class="free-arm"><path d="M0 0 L-8 25 L-3 47" class="none" stroke-width="6"/><circle cx="-3" cy="47" r="3" class="skin"/></g></g>
      <path d="M14 28 L26 43 L12 48" class="none" stroke-width="6"/><circle cx="12" cy="48" r="3" class="skin"/>
      <circle class="phone-glow" cx="10" cy="36" r="19" stroke="none"/><rect x="3" y="23" width="11" height="23" rx="2" class="ink"/><path d="M6 27 H11" class="none" stroke="#fff" stroke-width="1"/>
      <path d="M-5 13 L-5 21 M6 13 L5 21" class="none"/><circle cx="0" cy="0" r="14" class="skin"/>
      <path d="M-13 -7 Q0 -17 13 -7 L15 -1 L-15 -1Z" class="ink"/><path d="M-18 -1 L18 -1" class="none" stroke-width="3"/><circle cx="6" cy="3" r="1" class="ink" stroke="none"/>
    </g>
  </g></g>
</svg>
