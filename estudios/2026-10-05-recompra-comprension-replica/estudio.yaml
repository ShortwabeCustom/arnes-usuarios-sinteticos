# Réplica dentro del arnés de «Investigacion comprension de pantallas en recompra» (5 de octubre de 2026).
# Sirve para validar el arnés: mismas pantallas, zonas, panel, consigna y preguntas que el estudio original.
id: 2026-10-05-recompra-comprension-replica
titulo: "Comprensión de pantallas de resultado en recompra (OU-PWA) · réplica"
metodo: comprension
fecha: "2026-10-20"
autor: "Alexis Valdez + Claude"
producto: "Originación Única · PWA"
marca: {color: "#0B6B4F", nombre: "Banco Azteca"}
uix:                     # estándares de UiX (fuentes-equipo/uix/): naming del reporte
  proyecto: oupwa
  metodologia: abtesting   # compara variantes A/B de las pantallas de resultado
  tema: recompra-resultado-replica
  version: 1
  fecha_fin: "2026-10-20"
  cliente: "Originación Única · PWA"
  alcance: descriptiva

biblioteca: pwa
panel: base4          # el estudio original usó los cuatro perfiles sin capa OCEAN
modelo: sonnet
corridas: 3
paralelo: 6

pregunta_principal: "¿Se entiende que el efectivo está aprobado (E1) y que no hay efectivo pero sí crédito para tiendas (E2)?"
hipotesis:
  - {id: H1.2, texto: "«Aprobado» + «ya son tuyos» y «*Sujeto a aprobación» se contradicen.", se_sostiene_si: "Quien alcanza la nota responde distinto a «¿ya es tuyo?»", se_cae_si: "Todos responden igual"}
  - {id: H2.1, texto: "En vistazo, el número grande + «tienes» + «Aprobado» instalan «tengo $30,000 en efectivo».", se_sostiene_si: "Alguna corrida de vistazo responde «sí» a P3", se_cae_si: "Ninguna"}
  - {id: H2.3, texto: "«Saber mas» pasa inadvertido.", se_sostiene_si: "Queda fuera del vistazo y su atención predicha es baja", se_cae_si: "Entra"}
  - {id: H2.5, texto: "El bottom sheet no dice qué hacer para tener efectivo.", se_sostiene_si: "Tras leerlo, P9 sigue sin respuesta", se_cae_si: "Se responde"}

consigna: >-
  Ya tuviste un crédito con Banco Azteca. Hoy pediste desde la aplicación web un préstamo de $30,000 en
  efectivo. Después de enviar la solicitud te aparece una pantalla.

nombre_de_ejemplo: María
guia_estilo: pwa              # fuentes-producto/pwa/reglas-estilo.yaml
modos: [vistazo, completa]
velocidad_base: 3.5
velocidad_vistazo: 3.5
velocidades: [2.5, 3.5, 4.5]
pliegues: [640, 800]
orden_por_pliegue: false   # el estudio original no corregía por pliegue

pantallas:
  E1-A: {imagen: material/E1-A.jpg, grupo: E1, variante: A, recorte_superior: 86}
  E1-B: {imagen: material/E1-B.jpg, grupo: E1, variante: B, recorte_superior: 86}
