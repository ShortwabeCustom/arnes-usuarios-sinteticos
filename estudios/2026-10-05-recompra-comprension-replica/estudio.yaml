# Primero la abierta, después las cerradas, para no sembrar la respuesta.
# `correcta` por grupo; puede ser lista (varias válidas) o variar por momento (antes / id de continuación).
preguntas:
  - {id: p1, texto: "Con tus palabras, ¿qué te está diciendo esta pantalla?"}
  - {id: p2, texto: "¿Te aprobaron lo que pediste?", opciones: [si, no, en_parte, no_se], correcta: {E1: si, E2: [no, en_parte]}}
  - {id: p3, texto: "¿Puedes recibir los $30,000 en efectivo?", opciones: [si, no, no_se], correcta: {E1: si, E2: "no"}}
  - {id: p4, texto: "¿En qué o dónde puedes usar ese dinero?"}
  - {id: p5, texto: "¿Ya es tuyo o falta algo? ¿Qué?", opciones: [ya_es_mio, falta_algo, no_se]}
  - {id: p6, texto: "¿Qué pasa si tocas el botón verde? (si no lo viste, dilo)"}
  - {id: p7, texto: "¿Por qué te dieron esto y no efectivo? ¿La pantalla lo dice?", opciones: [lo_dice, no_lo_dice], solo: [E2], correcta: {E2: {antes: no_lo_dice, sheet: lo_dice}}}
  - {id: p8, texto: "¿Tocarías algo antes de continuar? ¿Qué y por qué?", opciones: [nada, saber_mas, una_tienda, boton_verde, otro], solo: [E2]}
  - {id: p9, texto: "¿Qué tendrías que hacer para tener efectivo más adelante? ¿El panel lo dice?", opciones: [lo_dice, no_lo_dice], solo: [E2], solo_continuacion: true, correcta: {E2: no_lo_dice}}
  - {id: p10, texto: "¿Cómo te deja lo que acabas de leer?", opciones: [positiva, neutra, negativa], solo: [E2], solo_continuacion: true}

continuaciones:
  - id: sheet
    tras: [completa]
    solo: [E2]
    imagen: material/sheet.png
    consigna: "Ahora tocaste «Saber mas» y se abrió un panel desde abajo."
    preguntas: [p2, p3, p7, p9, p10]
    texto: "¿Por qué puedo usarlo sólo en productos? Por tu historial crediticio, hoy puedes usar tu préstamo para comprar productos en nuestras tiendas. Al usarla y mantener tus pagos al día, puedes fortalecer tu historial crediticio y acceder a nuevas opciones de financiamiento. De acuerdo"
