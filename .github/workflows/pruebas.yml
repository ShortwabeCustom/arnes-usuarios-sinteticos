# Pruebas en cada push y pull request: guardia sobre todo el repositorio, lint y pytest.
# No baja el submódulo del vault (es privado y las pruebas no lo necesitan).
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest ruff
      - name: Guardia (correos, llaves, CURP, tarjetas)
        run: python -m arnes.guardia --todo .
      - name: Lint
        run: ruff check --select F,E9 arnes
      - name: Pruebas
        run: pytest tests -q
