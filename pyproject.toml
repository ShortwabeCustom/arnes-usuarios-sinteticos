[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arnes-ux-sintetico"
version = "0.1.0"
description = "Arnés para investigación UX con usuarios sintéticos basados en evidencia"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6",
    "numpy>=2",
    "pillow>=10",
    "opencv-contrib-python-headless>=4.10",
]

[project.scripts]
arnes = "arnes.cli:main"

[tool.setuptools.packages.find]
include = ["arnes*"]

[tool.setuptools.package-data]
arnes = ["reporte/*.css", "reporte/*.js", "reporte/plantilla_editorial/assets/**/*"]
